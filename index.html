<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="description" content="数字名片">
<title>数字名片</title>
<style>
  :root{
    /* ===== 广监云品牌色 ===== */
    --blue:#0044E6;                 /* 主色 · 科技蓝 */
    --cyan:#20C4C4;                 /* 辅助色 · 青蓝 */
    --ink:#1A1A1A;                  /* 主文字 · 深灰 */
    --sub:#666666;                  /* 次文字 · 灰 */
    --line:#EDF1F7;                 /* 分隔线 */
    --panel:#F7F9FE;                /* 面板浅底 */
    --blue-soft:rgba(0,68,230,.08); /* 主色浅底 */
    --cyan-soft:rgba(32,196,196,.28);
    --radius:22px;
    --shadow:0 18px 46px rgba(0,30,90,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
    background:#FFFFFF;
    min-height:100vh;
    display:flex;justify-content:center;align-items:flex-start;
    padding:26px 14px calc(40px + env(safe-area-inset-bottom));
  }
  .page{width:100%;max-width:420px}
  .card{
    background:#fff;border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .topbar{height:4px;background:linear-gradient(90deg,var(--blue) 0%,var(--cyan) 100%)}

  /* ===== 顶部 Tab 导航（新增模块①） ===== */
  .tabs{position:relative;display:flex;border-bottom:1px solid var(--line);background:#fff}
  .tab{
    flex:1;height:46px;background:none;border:none;cursor:pointer;
    font-family:inherit;font-size:14px;color:var(--sub);letter-spacing:3px;
    transition:color .2s;
  }
  .tab.active{color:var(--blue);font-weight:600}
  .tab-line{
    position:absolute;bottom:-1px;left:0;width:33.3333%;height:2.5px;border-radius:2px;
    background:linear-gradient(90deg,var(--blue),var(--cyan));
    transition:transform .25s ease;
  }
  .tabpage{display:none}
  .tabpage.show{display:block;animation:fadein .25s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ===== 头部 ===== */
  .hero{
    position:relative;text-align:center;color:var(--ink);
    background:#fff;padding:34px 26px 58px;
  }
  .hero .deco{position:absolute;border-radius:50%;pointer-events:none}
  .d1{width:210px;height:210px;right:-80px;top:-90px;background:rgba(0,68,230,.045)}
  .d2{width:130px;height:130px;left:-60px;bottom:-50px;background:rgba(32,196,196,.06)}
  .brand-logo{
    position:absolute;top:18px;left:22px;z-index:2;height:30px;max-width:130px;
    object-fit:contain;display:none;
  }
  .avatar{
    width:94px;height:94px;border-radius:50%;object-fit:cover;position:relative;z-index:1;
    border:3px solid #fff;
    box-shadow:0 0 0 2.5px rgba(0,68,230,.85),0 10px 24px rgba(0,30,90,.14);
    background:#fff;
  }
  .hero h1{position:relative;z-index:1;font-size:24px;font-weight:700;letter-spacing:2px;margin-top:16px;color:var(--ink)}
  .hero .title{position:relative;z-index:1;margin-top:6px;font-size:13.5px;color:var(--sub);letter-spacing:1px}
  .hero .divider{
    position:relative;z-index:1;width:36px;height:3px;border-radius:2px;margin:13px auto 0;
    background:linear-gradient(90deg,var(--blue),var(--cyan));
  }
  .hero .chip{
    position:relative;z-index:1;display:inline-block;margin-top:13px;padding:5px 14px;border-radius:99px;
    font-size:12px;color:var(--blue);background:var(--blue-soft);border:1px solid rgba(0,68,230,.18);
  }
  .hero .bio{
    position:relative;z-index:1;margin:14px auto 0;font-size:12.5px;line-height:1.75;color:var(--sub);
    max-width:300px;
  }

  /* ===== 快捷操作 ===== */
  .quick{display:flex;justify-content:center;gap:38px;margin:-28px 18px 4px;position:relative;z-index:2}
  .qa{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    background:none;border:none;cursor:pointer;text-decoration:none;
    font-size:11.5px;color:var(--sub);font-family:inherit;
  }
  .icbtn{
    width:56px;height:56px;border-radius:50%;background:#fff;color:var(--blue);
    border:1px solid var(--line);
    box-shadow:0 8px 20px rgba(0,30,90,.12);display:grid;place-items:center;
    transition:transform .15s ease,color .15s ease,box-shadow .15s ease;
  }
  .qa:active .icbtn{
    transform:scale(.9);color:var(--cyan);
    box-shadow:0 0 0 3px var(--cyan-soft),0 8px 20px rgba(0,30,90,.12);
  }

  /* ===== 信息面板 ===== */
  .panel{margin:16px 16px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .panel h2{font-size:11px;color:var(--sub);letter-spacing:3px;font-weight:600;padding:13px 16px 7px}
  .row{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:12px 16px;background:none;border:none;border-top:1px solid var(--line);
    cursor:pointer;font-family:inherit;
  }
  .panel h2 + .row{border-top:none}
  .row:active{background:rgba(0,68,230,.06)}
  .ricon{
    width:34px;height:34px;border-radius:10px;background:var(--blue-soft);color:var(--blue);
    display:grid;place-items:center;flex:none;
  }
  .rmain{flex:1;min-width:0}
  .rlabel{display:block;font-size:11px;color:var(--sub);letter-spacing:1px}
  .rval{display:block;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .raction{color:var(--cyan);flex:none}
  .raction + .raction{margin-left:-4px}

  /* ===== 底部按钮（3个） ===== */
  .actions{display:grid;grid-template-columns:1.18fr 1.08fr 1fr;gap:8px;margin:18px 16px 4px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:5px;height:44px;
    border-radius:13px;font-size:12.5px;font-weight:600;letter-spacing:.5px;cursor:pointer;
    font-family:inherit;transition:transform .1s,box-shadow .15s,background .15s;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    border:none;color:#fff;background:linear-gradient(135deg,#0044E6,#2E63F0);
    box-shadow:0 8px 20px rgba(0,68,230,.28);
  }
  .btn.primary:active{box-shadow:0 0 0 3px var(--cyan-soft),0 8px 20px rgba(0,68,230,.28)}
  .btn.appt{background:var(--blue-soft);border:1.5px solid rgba(32,196,196,.55);color:var(--blue)}
  .btn.appt:active{background:var(--cyan-soft)}
  .btn.ghost{background:#fff;border:1.5px solid rgba(0,68,230,.30);color:var(--blue)}
  .btn.ghost:active{background:var(--blue-soft)}

  /* ===== 访问数据（新增模块⑥） ===== */
  .stats{
    display:flex;align-items:center;justify-content:center;gap:6px;
    color:var(--sub);font-size:11.5px;margin:14px 16px 0;letter-spacing:.5px;
  }
  .stats b{color:var(--blue);font-size:13px;font-variant-numeric:tabular-nums}
  .stats svg{color:var(--cyan)}
  .foot{text-align:center;color:var(--sub);opacity:.65;font-size:10.5px;margin:6px 16px 20px;letter-spacing:1px}

  /* ===== 业务 Tab（新增模块②③） ===== */
  .biz{padding:20px 16px 26px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 12px}
  .sec-head h3{font-size:15px;color:var(--ink);letter-spacing:1px}
  .sec-head span{font-size:10.5px;color:var(--cyan);letter-spacing:2px;font-weight:600}
  .biz-intro{font-size:12.5px;color:var(--sub);line-height:1.8;margin:0 4px 16px}
  .svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .svc{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 14px;
    transition:background .15s,border-color .15s;
  }
  .svc:active{background:#fff;border-color:rgba(0,68,230,.35)}
  .sic{
    width:40px;height:40px;border-radius:11px;background:var(--blue-soft);color:var(--blue);
    display:grid;place-items:center;
  }
  .svc h4{font-size:14px;color:var(--ink);margin-top:10px;letter-spacing:.5px}
  .svc p{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.6}

  /* ===== 视频 Tab（新增模块④） ===== */
  .vpage{padding:20px 16px 26px}
  .vcover{
    position:relative;height:180px;border-radius:14px;overflow:hidden;cursor:pointer;
    background:linear-gradient(135deg,#0044E6 0%,#2E63F0 55%,#20C4C4 130%);
    display:grid;place-items:center;
  }
  .vdeco{position:absolute;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
  .vdeco.a{width:140px;height:140px;right:-40px;top:-50px}
  .vdeco.b{width:90px;height:90px;left:-30px;bottom:-30px;background:rgba(255,255,255,.07)}
  .vplay{
    width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.94);color:var(--blue);
    display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,30,90,.35);
    transition:transform .15s;
  }
  .vcover:active .vplay{transform:scale(.9)}
  .vtime{
    position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;
    font-size:10.5px;padding:3px 8px;border-radius:6px;letter-spacing:1px;
  }
  .vmeta{margin-top:12px;padding:0 4px}
  .vmeta h4{font-size:14.5px;color:var(--ink);letter-spacing:.5px}
  .vmeta p{font-size:12px;color:var(--sub);margin-top:4px}
  .vhint{margin-top:14px;text-align:center;font-size:11px;color:var(--sub);opacity:.7;letter-spacing:1px}

  /* ===== 弹窗通用 ===== */
  .mask{
    position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(10,20,40,.55);backdrop-filter:blur(3px);padding:24px;
  }
  .mask.show{display:flex}
  .modal{
    background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:320px;
    text-align:center;animation:pop .22s ease;
    box-shadow:0 24px 60px rgba(0,30,90,.25);
  }
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{font-size:16px;color:var(--ink);letter-spacing:1px}
  .modal .msub{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.7}
  .qrwrap{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:14px;display:inline-block}
  .qrwrap img{width:180px;height:180px;display:block;object-fit:contain}
  .qr-ph{
    width:180px;height:180px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    border:1.5px dashed rgba(0,68,230,.35);border-radius:10px;color:var(--sub);font-size:11.5px;line-height:1.7;padding:12px;
  }
  .wxline{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:13px;color:var(--ink)}
  .wxline .id{font-weight:600}
  .mini{
    border:none;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:600;
    background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:4px 12px;
  }
  .mini:active{background:var(--cyan-soft)}
  .mclose{
    margin-top:16px;width:100%;height:40px;border:none;border-radius:11px;cursor:pointer;
    background:var(--blue-soft);color:var(--blue);font-size:13.5px;font-weight:600;font-family:inherit;
  }
  .tipsteps{text-align:left;margin-top:14px;font-size:12.5px;color:var(--sub);line-height:2}
  .tipsteps b{color:var(--blue)}

  /* ===== 预约洽谈表单（新增模块⑤） ===== */
  .field{
    width:100%;height:44px;margin-top:10px;padding:0 13px;
    border:1px solid var(--line);border-radius:11px;background:var(--panel);
    font-size:13.5px;color:var(--ink);font-family:inherit;outline:none;
    transition:border-color .15s,background .15s,box-shadow .15s;
  }
  .field:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(0,68,230,.10)}
  textarea.field{height:76px;padding:11px 13px;resize:none;line-height:1.6}
  .sub-btn{width:100%;height:44px;margin-top:12px}
  .okring{
    width:56px;height:56px;border-radius:50%;background:var(--cyan-soft);color:var(--cyan);
    display:grid;place-items:center;margin:16px auto 6px;animation:pop .3s ease;
  }
  .okring svg{width:26px;height:26px}

  /* ===== 视频播放弹窗 ===== */
  .vmodal{
    background:#fff;border-radius:18px;overflow:hidden;width:100%;max-width:380px;
    animation:pop .22s ease;box-shadow:0 24px 60px rgba(0,30,90,.35);
  }
  .vmodal video{width:100%;aspect-ratio:16/9;background:#000;display:block}
  .vmodal .mclose{margin:0;border-radius:0;height:44px}

  /* ===== Toast ===== */
  .toast{
    position:fixed;left:50%;bottom:70px;z-index:99;
    transform:translateX(-50%) translateY(10px);
    background:rgba(26,26,26,.92);color:#fff;font-size:13px;
    padding:10px 18px;border-radius:99px;max-width:82vw;text-align:center;
    opacity:0;pointer-events:none;transition:all .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== 图标 ===== */
  .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ric{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ric.sm{width:15px;height:15px}
</style>
</head>

<div class="page">
  <section class="card">
    <div class="topbar"></div>

    <!-- ===== 顶部 Tab 导航（新增模块①） ===== -->
    <nav class="tabs">
      <button class="tab active" data-tab="card" type="button">名 片</button>
      <button class="tab" data-tab="biz" type="button">业 务</button>
      <button class="tab" data-tab="video" type="button">视 频</button>
      <span class="tab-line" id="tab-line"></span>
    </nav>

    <!-- ================= Tab 1：名片 ================= -->
    <div class="tabpage show" id="page-card">

      <!-- 头部 -->
      <header class="hero">
        <div class="deco d1"></div><div class="deco d2"></div>
        <img class="brand-logo" id="brand-logo" alt="公司LOGO">
        <img class="avatar" id="avatar" alt="头像">
        <h1 id="d-name"></h1>
        <p class="title" id="d-title"></p>
        <div class="divider"></div>
        <span class="chip" id="d-company"></span>
        <p class="bio" id="d-bio"></p>
      </header>

      <!-- 快捷操作 -->
      <nav class="quick">
        <a class="qa" id="qa-phone">
          <span class="icbtn"><svg class="ic"><use href="#i-phone"/></svg></span>
          <span>打电话</span>
        </a>
        <button class="qa" id="qa-mail" type="button">
          <span class="icbtn"><svg class="ic"><use href="#i-mail"/></svg></span>
          <span>复制邮箱</span>
        </button>
        <button class="qa" id="qa-wechat" type="button">
          <span class="icbtn"><svg class="ic"><use href="#i-wechat"/></svg></span>
          <span>加微信</span>
        </button>
      </nav>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
 *  ① 名片数据配置 —— 所有内容都在这里改，保存刷新即生效
 * ========================================================= */
const C = {

  /* ---------- 基本信息 ---------- */
  name:    "赵 允",                      // 姓名
  title:   "HR",                    // 职位
  company: "北京广监云科技有限公司",        // 公司
  bio:     "专注组织发展与人才战略，让每一份人才决策都有据可依。",  // 一句话简介

  /* ---------- 联系方式 ---------- */
  phone:   "186 1122 6701",              // 电话（空格随意，拨号时自动去除）
  email:   "hr@gjian.com",               // 邮箱
  wechatId:"186 1122 6701",              // 微信号
  address: "北京市海淀区知春路68号院1号楼10层1001",
  website: "https://www.gjian.com",

  /* ---------- 图片资源（留空 "" 显示占位效果） ---------- */
  logo:     "./广监云.png",      // 公司 LOGO（头部左上角）
  avatar:   "./photos/赵允.jpg",        // 头像（留空自动生成姓名首字渐变头像）
  wechatQR: "./photos/微信二维码.jpg",  // 微信二维码（留空显示占位提示）

  /* ===== 新增⑦ 地图导航 =====
   * 替换为公司真实经纬度，查询工具：高德坐标拾取器
   * https://lbs.amap.com/tools/picker （拾取后按 经度,纬度 填写） */
  map: { lng: "116.325", lat: "39.977" },

  /* ===== 新增⑥ 访问数据 =====
   * 名片底部「已有 N 位客户访问」的数字，改这里 */
  visitCount: 128,

  /* ===== 新增②③ 核心业务（业务 Tab 的 2x2 网格） =====
   * 公司一句话介绍 + 4 个服务卡片，可增删；
   * icon 可选值：monitor / shield / chart / code */
  companyIntro: "大羽·AI隐患排查：重塑隐患排查治理模式 全面提升安全治理能力",
  services: [
    { icon: "monitor", title: "大羽·安全应急模型", desc: "国内率先发布的安全应急垂类大模型" },
    { icon: "shield",  title: "九小场所·AI隐患排查智能体",   desc: "适用于各级政府、街道办事处、各行业监管部门对九小场所的隐患排查治理业务场景，用AI技术助力安全监管减负提质增效" },
    { icon: "chart",   title: "大羽·应急安全管理系统智能体",   desc: "对话即操作，从自然语言到业务结果的直通车" },
    { icon: "code",    title: "重点场所·AI隐患排查智能体",   desc: "面向医院、养老机构、院校、宾馆酒店、大型商业综合体、交通枢纽等重点消防安全场所，依托AI大模型技术赋能隐患排查全流程，助力各类经营主体构建闭环式隐患治理体系" }
  ],

  /* ===== 新增④ 企业视频（视频 Tab） =====
   * url 为占位视频，替换为你的正式视频 mp4 链接；
   * dur 是封面右下角显示的时长角标 */
  video: {
    title: "广监云 · 企业宣传片",
    desc:  "3 分钟了解我们的平台与服务",
    dur:   "02:30",
    url:   "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
  }
};

/* ============ 以下为实现代码，无需修改 ============ */
const $ = id => document.getElementById(id);

/* ---------- 工具 ---------- */
let toastTimer = null;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2000);
}
function copyText(text, tip){
  const done = () => toast(tip || "已复制");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  ok ? done() : toast("复制失败，请手动复制");
}
function esc(s){
  return String(s).replace(/[&<>"']/g, m =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]);
}
function cleanPhone(p){ return String(p).replace(/[^\d+]/g, ""); }

/* ---------- 占位头像（姓名首字） ---------- */
function initialsAvatar(name){
  const ch = (name || "名").trim().charAt(0);
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="188" height="188">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="#0044E6"/><stop offset="1" stop-color="#20C4C4"/>' +
    '</linearGradient></defs>' +
    '<rect width="188" height="188" fill="url(#g)"/>' +
    '<text x="94" y="122" font-family="PingFang SC,Microsoft YaHei,sans-serif" ' +
    'font-size="78" fill="#ffffff" text-anchor="middle">' + ch + '</text></svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* ---------- 渲染：名片 ---------- */
document.title = C.name + " · 数字名片";
$("avatar").src = C.avatar || initialsAvatar(C.name);
/* 头像加载失败时自动回退到首字占位头像，避免裂图 */
$("avatar").onerror = function(){
  this.onerror = null;
  this.src = initialsAvatar(C.name);
};
/* LOGO：有配置则显示，加载失败自动隐藏 */
if (C.logo) {
  const lg = $("brand-logo");
  lg.src = C.logo;
  lg.style.display = "block";
  lg.onerror = function(){ lg.style.display = "none"; };
}
$("d-name").textContent    = C.name;
$("d-title").textContent   = C.title;
$("d-company").textContent = C.company;
$("d-bio").textContent     = C.bio;

$("qa-phone").href = "tel:" + cleanPhone(C.phone);
$("v-phone").textContent = C.phone;
$("v-email").textContent = C.email;
$("v-addr").textContent  = C.address;
$("v-web").textContent   = String(C.website).replace(/^https?:\/\//, "");
$("row-web").href = C.website;

$("row-phone").addEventListener("click", ()=>copyText(cleanPhone(C.phone), "电话已复制"));
$("row-email").addEventListener("click", ()=>copyText(C.email, "邮箱已复制"));
$("row-addr").addEventListener("click", ()=>copyText(C.address, "地址已复制"));

/* ---------- 新增⑦：高德地图导航 ---------- */
$("btn-nav").addEventListener("click", e => {
  e.stopPropagation();  /* 不触发整行的复制地址 */
  const url = "https://uri.amap.com/marker?position=" + C.map.lng + "," + C.map.lat +
              "&name=" + encodeURIComponent(C.company);
  window.open(url, "_blank");
});

/* ---------- 新增①：Tab 切换 ---------- */
const tabLine = $("tab-line");
document.querySelectorAll(".tab").forEach((tab, i) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.querySelectorAll(".tabpage").forEach(p => p.classList.remove("show"));
    $("page-" + tab.dataset.tab).classList.add("show");
    tabLine.style.transform = "translateX(" + (i * 100) + "%)";
  });
});

/* ---------- 新增⑥：访问数据（数字滚动微交互） ---------- */
(function countUp(){
  const el = $("visit-num"), target = C.visitCount, dur = 1200;
  const t0 = performance.now();
  (function tick(t){
    const p = Math.min((t - t0) / dur, 1);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
})();

/* ---------- 新增②③：核心业务渲染 ---------- */
$("biz-intro").textContent = C.companyIntro;
const grid = $("svc-grid");
C.services.forEach(s => {
  const d = document.createElement("div");
  d.className = "svc";
  d.innerHTML =
    '<span class="sic"><svg class="ric"><use href="#i-' + esc(s.icon) + '"/></svg></span>' +
    '<h4>' + esc(s.title) + '</h4>' +
    '<p>' + esc(s.desc) + '</p>';
  grid.appendChild(d);
});

/* ---------- 新增④：企业视频 ---------- */
const bizVideo = $("biz-video");
$("v-title").textContent = C.video.title;
$("v-desc").textContent  = C.video.desc;
$("v-dur").textContent   = C.video.dur;
$("video-cover").addEventListener("click", () => {
  bizVideo.src = C.video.url;      /* 点击时才加载，避免预载流量 */
  $("video-mask").classList.add("show");
  bizVideo.play().catch(()=>{});
});
function stopVideo(){
  bizVideo.pause();
  bizVideo.removeAttribute("src");
  bizVideo.load();
}

/* ---------- 新增⑤：预约洽谈 ---------- */
function resetAppt(){
  $("appt-form").reset();
  $("appt-form").style.display = "block";
  $("appt-ok").style.display = "none";
}
$("btn-appt").addEventListener("click", () => {
  resetAppt();
  $("appt-mask").classList.add("show");
});
$("appt-form").addEventListener("submit", e => {
  e.preventDefault();
  const name  = $("appt-name").value.trim();
  const phone = $("appt-phone").value.replace(/\D/g, "");
  if (!name)               { toast("请填写您的姓名"); return; }
  if (phone.length < 6)    { toast("请填写正确的联系电话"); return; }
  /* 演示环境：无后端，直接展示成功态。
   * 接入后端时，在此处把 name / phone / $("appt-need").value 提交到你的接口 */
  $("appt-form").style.display = "none";
  $("appt-ok").style.display = "block";
  setTimeout(() => closeMask($("appt-mask")), 2200);
});

/* ---------- 微信二维码弹窗 ---------- */
function openQR(){
  const img = $("qr-img"), ph = $("qr-ph");
  if (C.wechatQR) { img.src = C.wechatQR; img.style.display = "block"; ph.style.display = "none"; }
  else            { img.style.display = "none"; ph.style.display = "flex"; }
  $("wx-id").textContent = C.wechatId;
  $("qr-mask").classList.add("show");
}
$("qa-wechat").addEventListener("click", openQR);
$("qa-mail").addEventListener("click", ()=>copyText(C.email, "邮箱已复制：" + C.email));
$("wx-copy").addEventListener("click", ()=>copyText(C.wechatId, "微信号已复制"));

/* ---------- 弹窗统一关闭逻辑 ---------- */
function closeMask(mask){
  mask.classList.remove("show");
  if (mask.id === "video-mask") stopVideo();
  if (mask.id === "appt-mask")  resetAppt();
}
document.querySelectorAll(".mask").forEach(mask => {
  mask.addEventListener("click", e => { if (e.target === mask) closeMask(mask); });
});
document.querySelectorAll("[data-close]").forEach(btn => {
  btn.addEventListener("click", ()=>closeMask(btn.closest(".mask")));
});

/* ---------- 保存联系人（vCard） ---------- */
function buildVCard(){
  return [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "FN:" + C.name,
    "N:" + C.name.replace(/\s+/g, ",") + ";;;",
    "ORG:" + C.company,
    "TITLE:" + C.title,
    "TEL;TYPE=CELL:" + cleanPhone(C.phone),
    "EMAIL;TYPE=WORK:" + C.email,
    "ADR;TYPE=WORK:;;" + C.address + ";;;;",
    "URL:" + C.website,
    "NOTE:" + C.bio,
    "END:VCARD"
  ].join("\r\n");
}
function saveContact(){
  /* 微信内置浏览器不支持下载 vcf，给出引导 */
  if (/micromessenger/i.test(navigator.userAgent)) {
    $("tip-mask").classList.add("show");
    return;
  }
  const vcf = buildVCard();
  try {
    const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = C.name.replace(/\s+/g, "") + ".vcf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast("已开始下载，打开文件即可保存到通讯录");
  } catch (e) {
    window.open("data:text/vcard;charset=utf-8," + encodeURIComponent(vcf));
  }
}
$("btn-vcf").addEventListener("click", saveContact);

/* ---------- 分享名片 ---------- */
async function shareCard(){
  const summary = C.name + "\n" + C.title + "｜" + C.company +
                  "\n电话：" + cleanPhone(C.phone) + "\n邮箱：" + C.email +
                  "\n地址：" + C.address;
  if (navigator.share) {
    try {
      await navigator.share({
        title: C.name + " · " + C.title,
        text:  C.name + "｜" + C.title + "｜" + C.company,
        url:   location.href
      });
    } catch (e) { /* 用户取消分享，忽略 */ }
  } else if (location.protocol === "file:") {
    copyText(summary, "名片信息已复制，去粘贴给好友吧");
  } else {
    copyText(location.href, "名片链接已复制，去粘贴给好友吧");
  }
}
$("btn-share").addEventListener("click", shareCard);
</script>
