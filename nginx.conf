# 数字名片 Nginx 站点配置
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        list.html index.html;

    # 中文文件名 URL 编码支持（如 广监云.png）
    charset utf-8;

    # gzip 压缩（HTML/CSS/JS/SVG）
    gzip             on;
    gzip_comp_level  5;
    gzip_min_length  1024;
    gzip_types       text/html text/css application/javascript image/svg+xml;

    # 静态图片缓存 7 天（改图后需刷新缓存或改文件名）
    location ~* \.(png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 个人微信分享中转页(/s/工号.html)：文件不存在时 302 跳回名片页，分享链接永不 404
    location ~ ^/s/(?<sid>[A-Za-z0-9_-]+)[.]html$ {
        add_header Cache-Control "no-cache";
        try_files $uri @share_fallback;
    }
    location @share_fallback {
        return 302 /card.html?id=$sid;
    }

    # HTML 不缓存，保证改配置后刷新即生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
