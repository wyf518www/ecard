<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>赵 允 · HR｜北京广监云科技有限公司</title>
<meta name="description" content="北京广监云科技有限公司｜电话 186 1122 6701｜专注组织发展与人才战略，让每一份人才决策都有据可依。">
<style>
:root{--blue:#0044E6;--cyan:#20C4C4;--ink:#1A1A1A;--muted:#999;--paper:#fff;--mist:#F4F6FB}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:48px 24px;
  padding:calc(48px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  color:var(--ink);background-color:var(--mist);
  background-image:radial-gradient(ellipse at 8% 12%,rgba(0,68,230,.11),transparent 52%),radial-gradient(ellipse at 92% 88%,rgba(32,196,196,.13),transparent 52%);
}
.top{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.sp{
  position:relative;width:100%;max-width:380px;min-width:0;padding:36px 30px 22px;
  text-align:center;background:var(--paper);border:1px solid rgba(0,68,230,.06);border-radius:24px;
  box-shadow:0 24px 64px rgba(0,30,90,.12),0 2px 6px rgba(0,30,90,.06);
  animation:fadeUp .65s cubic-bezier(.22,1,.36,1) both;
}
.sp::before{content:"";position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.av{
  position:relative;display:grid;place-items:center;width:84px;height:84px;margin:0 auto;border-radius:50%;
  border:3px solid var(--paper);background:linear-gradient(135deg,var(--blue),var(--cyan));
  box-shadow:0 0 0 2px rgba(0,68,230,.8),0 8px 20px rgba(0,30,90,.12);
  color:#fff;font-size:32px;font-weight:600;line-height:1;overflow:hidden;
}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--paper);border-radius:50%}
.sp h1{margin-top:20px;font-size:22px;font-weight:700;line-height:1.45;letter-spacing:2px;overflow-wrap:anywhere}
.company{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.8;letter-spacing:1px;overflow-wrap:anywhere}
.role{display:inline-block;max-width:100%;margin-top:14px;padding:5px 14px;border-radius:99px;border:1px solid rgba(0,68,230,.16);background:rgba(0,68,230,.06);color:var(--blue);font-size:12px;line-height:1.6;letter-spacing:1px;overflow-wrap:anywhere}
.contact{margin-top:26px;padding-top:22px;border-top:1px solid #EDF1F7}
.phone{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;max-width:100%;min-height:48px;padding:7px 18px 7px 8px;
  border:1px solid rgba(0,68,230,.15);border-radius:99px;background:#F4F7FF;color:var(--blue);text-decoration:none;
  transition:background-color .18s,border-color .18s,color .18s;
}
.phone-icon{display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:var(--paper);box-shadow:0 2px 5px rgba(0,30,90,.06)}
.phone-icon svg{width:16px;height:16px}
.phone-number{min-width:0;font-size:16px;font-weight:600;line-height:1.5;letter-spacing:.8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.phone:active{color:#087D82;background:rgba(32,196,196,.14);border-color:var(--cyan)}
.phone:active .phone-icon{background:var(--cyan);color:#fff}
.manual{display:flex;align-items:center;justify-content:center;gap:9px;width:fit-content;max-width:100%;min-height:44px;margin:16px auto 0;padding:8px 4px;color:#666;font-size:12px;line-height:1.7;letter-spacing:1px;text-decoration:none}
.manual-label{min-width:0;overflow-wrap:anywhere}
.manual::before{content:"";flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:breathe 1.8s ease-in-out infinite}
.manual svg{flex:0 0 14px;width:14px;height:14px;color:var(--blue)}
.manual:active{color:var(--blue)}
a:focus-visible{outline:2px solid var(--blue);outline-offset:5px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{opacity:.6;box-shadow:0 0 0 0 rgba(32,196,196,0)}50%{opacity:1;box-shadow:0 0 0 4px rgba(32,196,196,.14)}}
@media(max-width:400px){
  body{padding:36px 18px;padding:calc(36px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
  .sp{padding:30px 24px 18px;border-radius:22px}
  .av{width:78px;height:78px;font-size:30px}
  .sp h1{margin-top:18px}.contact{margin-top:22px;padding-top:20px}
}
@media(max-width:359px){
  body{padding:28px 12px;padding:calc(28px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
  .sp{padding:26px 18px 16px;border-radius:20px}
  .av{width:72px;height:72px;font-size:28px}.sp h1{font-size:20px}
  .company{letter-spacing:.5px}.role{padding:4px 12px}
  .contact{margin-top:20px;padding-top:18px}.phone{gap:8px;padding-right:14px}.phone-number{font-size:14px;letter-spacing:.5px}
  .manual{font-size:11px;letter-spacing:.5px;margin-top:12px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

</main>
</body>
